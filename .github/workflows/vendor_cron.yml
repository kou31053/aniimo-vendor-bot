name: Run Mysterious Vendor Notifier

on:
  # Lịch tự động chạy (Mặc định cứ mỗi 6 tiếng script sẽ chạy 1 lần để kiểm tra)
  schedule:
    - cron: '0 */6 * * *'
  # Cho phép bấm nút chạy thủ công trên web bất cứ lúc nào bạn muốn
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python bot.py
